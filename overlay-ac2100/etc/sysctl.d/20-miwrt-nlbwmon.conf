# nlbwmon, which counts the traffic of every device, asks for a netlink receive
# buffer of 524288 bytes. The kernel's limit for such a request is 180224 bytes
# on this router, so the buffer was cut to a third and nlbwmon said so at every
# start. This raises the limit to what it asks for. Only a program that asks
# for a larger buffer gets one; nothing else changes.
net.core.rmem_max=524288
