name: ac2100 image

# MiWRT for the Xiaomi Redmi Router AC2100, built with the official OpenWrt
# ImageBuilder: every package from the official mipsel_24kc feeds and the
# MiWRT files copied in as plain files. One thing is compiled here: the two
# kernel modules of the 5 GHz driver, from OpenWrt's own mt76 source plus
# scripts/ac2100/mt76-patches (transmit beamforming, off unless switched on),
# with the official SDK of the same release. They replace the two files the
# packages bring. About five minutes, fifteen more when the driver has to be
# compiled. The same SDK builds this router's MiWRT package feed from
# miwrt-feed/ (scripts/ac2100/build-feed.sh: Xray and Tailscale), published on
# GitHub Pages next to the BE7000 feeds. Separate from build.yml on purpose:
# nothing here touches the BE7000 image.
#
# Every run builds, verifies and keeps the image as a workflow artifact. A
# push of a v* tag, the same tag build.yml releases the BE7000 image for, also
# signs the checksum list with the MiWRT key, puts the files into that tag's
# GitHub release next to the BE7000 ones and mirrors the image on GitHub
# Pages for miwrt-update. Both routers carry one version number.

on:
  workflow_dispatch:
    inputs:
      openwrt:
        description: "OpenWrt release the ImageBuilder comes from"
        default: "25.12.6"
      imagebuilder_sha256:
        description: "Expected SHA-256 of the ImageBuilder archive (empty: trust downloads.openwrt.org's sha256sums and print the hash to pin)"
        default: ""
      release_tag:
        description: "Put the image into the release of this tag (vX.Y.Z); release and tag are created on the built commit if they do not exist. Empty: build only"
        default: ""
      publish_feed:
        description: "Publish this router's package feed on GitHub Pages (main only; a release always does)"
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - "overlay-ac2100/**"
      - "scripts/ac2100/**"
      - "miwrt-feed/miwrt-xray/**"
      - "miwrt-feed/miwrt-tailscale/**"
      - ".github/workflows/build-ac2100.yml"
    tags: [ "v*" ]

concurrency:
  group: ac2100-image-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT: ${{ inputs.openwrt || '25.12.6' }}
  IB_SHA256: ${{ inputs.imagebuilder_sha256 || '' }}
  # the release tag: from a pushed v* tag, or from the dispatch input (a tag
  # that does not exist yet is created by the release step on the built commit)
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  TARGET: ramips/mt7621
  PROFILE: xiaomi_redmi-router-ac2100
  DEVICE: openwrt-ramips-mt7621-xiaomi_redmi-router-ac2100
  # a release holds the files of both routers: the BE7000 list is
  # sha256sums.txt, this router's has a name of its own
  SUMS: sha256sums-ac2100.txt

jobs:
  image:
    runs-on: ubuntu-24.04
    # the release step writes to the GitHub release (and creates it and its tag
    # when they do not exist), the mirror step pushes to gh-pages: both need
    # write access to contents with the job token
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            build-essential libncurses-dev zlib1g-dev gawk gettext libssl-dev xsltproc \
            rsync wget unzip python3 python3-setuptools zstd file \
            git flex bison bc libelf-dev swig

      - name: Download and verify the ImageBuilder
        run: |
          set -eu
          base="https://downloads.openwrt.org/releases/$OPENWRT/targets/$TARGET"
          ib="openwrt-imagebuilder-$OPENWRT-${TARGET/\//-}.Linux-x86_64.tar.zst"
          curl -fsSL -o "$ib" "$base/$ib"
          curl -fsSL -o sha256sums "$base/sha256sums"
          grep " \*$ib\$" sha256sums | sha256sum -c -
          have=$(sha256sum "$ib" | cut -d' ' -f1)
          # the archive hash seen on the first build of each release; a new
          # release gets its line after its first run has been looked at
          case "$OPENWRT" in
            25.12.6) pin=4c8b3874b686077372839bc246d5f40e822a0082747dfbb181940e158089c2d5 ;;
            *) pin= ;;
          esac
          want=${IB_SHA256:-$pin}
          if [ -n "$want" ]; then
            [ "$have" = "$want" ] || { echo "::error::ImageBuilder sha256 is $have, expected $want"; exit 1; }
            echo "ImageBuilder archive matches the pinned hash"
          else
            echo "::notice::ImageBuilder $ib sha256 $have (pin it in the workflow once reviewed)"
          fi
          echo "imagebuilder sha256 $have  $ib"
          echo "IB_HASH=$have" >> "$GITHUB_ENV"
          mkdir ib
          tar --zstd -xf "$ib" -C ib --strip-components=1
          ls ib

      # The 5 GHz driver (see the top of this file). Its two modules depend on
      # the OpenWrt release, the patches and the build script and on nothing
      # else, so a build that changes none of them takes the modules an
      # earlier run made. A release never does: it compiles them itself.
      - name: Wi-Fi driver from an earlier run
        id: wifi-cache
        if: env.RELEASE_TAG == ''
        uses: actions/cache@v4
        with:
          path: wifi-driver/lib
          key: ac2100-wifi-driver-${{ env.OPENWRT }}-${{ hashFiles('scripts/ac2100/build-wifi-driver.sh', 'scripts/ac2100/mt76-patches/*.patch') }}

      # The feed packages (see the top of this file) are kept the same way
      # between runs that change nothing they are built from; a release
      # builds them itself, and so does a run that publishes the feed.
      - name: Feed packages from an earlier run
        id: feed-cache
        if: env.RELEASE_TAG == '' && !inputs.publish_feed
        uses: actions/cache@v4
        with:
          path: ac2100-feed
          key: ac2100-feed-${{ env.OPENWRT }}-${{ hashFiles('scripts/ac2100/build-feed.sh', 'miwrt-feed/miwrt-xray/**', 'miwrt-feed/miwrt-tailscale/**') }}

      - name: Download and verify the SDK
        if: steps.wifi-cache.outputs.cache-hit != 'true' || steps.feed-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          base="https://downloads.openwrt.org/releases/$OPENWRT/targets/$TARGET"
          sdk=$(grep -oE 'openwrt-sdk-[^ ]+\.Linux-x86_64\.tar\.zst$' sha256sums | head -n 1)
          [ -n "$sdk" ] || { echo "::error::no SDK in the release's sha256sums"; exit 1; }
          curl -fsSL -o "$sdk" "$base/$sdk"
          grep " \*$sdk\$" sha256sums | sha256sum -c -
          have=$(sha256sum "$sdk" | cut -d' ' -f1)
          # pinned like the ImageBuilder above
          case "$OPENWRT" in
            25.12.6) pin=e4e3f25962ddf3ed55207fed456ecd1d6e55f3482c976b3183a640df6ef0adf0 ;;
            *) pin= ;;
          esac
          if [ -n "$pin" ]; then
            [ "$have" = "$pin" ] || { echo "::error::SDK sha256 is $have, expected $pin"; exit 1; }
            echo "SDK archive matches the pinned hash"
          else
            echo "::notice::SDK $sdk sha256 $have (pin it in the workflow once reviewed)"
          fi
          # each build below unpacks its own copy: they set up feeds differently
          mv "$sdk" sdk.tar.zst

      - name: Build the Wi-Fi driver
        if: steps.wifi-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir sdk-wifi
          tar --zstd -xf sdk.tar.zst -C sdk-wifi --strip-components=1
          scripts/ac2100/build-wifi-driver.sh sdk-wifi wifi-driver || {
            for l in wifi-driver/*.log; do echo "::group::end of $l"; tail -n 60 "$l"; echo "::endgroup::"; done
            exit 1
          }
          rm -rf sdk-wifi

      - name: Assemble the MiWRT files
        run: |
          set -eu
          TAG="$RELEASE_TAG"
          if [ -n "$TAG" ]; then
            printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)*(-[0-9A-Za-z][0-9A-Za-z.-]*)?$' || { echo "::error::release tag must look like v2.1.0, got '$TAG'"; exit 1; }
            # the version is the tag without the "v" and without a suffix, as in build.yml
            VER="${TAG#v}"; VER="${VER%%-*}"
          else
            VER=dev
          fi
          scripts/ac2100/assemble-files.sh ib/files "$VER" "$TAG" "${{ github.run_id }}" "$OPENWRT"
          echo "VER=$VER" >> "$GITHUB_ENV"
          # the 5 GHz driver built (or restored) above, at the place the packages put theirs
          kver=$(ls wifi-driver/lib/modules | head -n 1)
          [ -s "wifi-driver/lib/modules/$kver/mt7615-common.ko" ] && [ -s "wifi-driver/lib/modules/$kver/mt7615e.ko" ] ||
            { echo "::error::the Wi-Fi driver modules are missing"; exit 1; }
          mkdir -p "ib/files/lib/modules/$kver"
          cp "wifi-driver/lib/modules/$kver/mt7615-common.ko" "wifi-driver/lib/modules/$kver/mt7615e.ko" "ib/files/lib/modules/$kver/"
          chmod 644 "ib/files/lib/modules/$kver/"*.ko
          (cd wifi-driver && sha256sum lib/modules/"$kver"/*.ko) | tee wifi-driver.sha256
          echo "--- /etc/miwrt-release"; cat ib/files/etc/miwrt-release
          echo "--- files"; (cd ib/files && find . -type f -o -type l | sort)

      # The key the BE7000 feed and releases are signed with. Its public half
      # goes into the image so miwrt-update can check a release signature and
      # apk can trust a MiWRT feed later; the private half signs the checksum
      # list of a release below. A fork without the secret builds an unsigned
      # image that cannot self-update.
      - name: Signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "$APK_SIGNING_KEY" ]; then
            echo "::warning::APK_SIGNING_KEY secret is not set: unsigned build, no release possible"
            echo "SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          printf '%s\n' "$APK_SIGNING_KEY" > "$RUNNER_TEMP/private-key.pem"
          mkdir -p ib/files/etc/apk/keys
          openssl ec -in "$RUNNER_TEMP/private-key.pem" -pubout -out ib/files/etc/apk/keys/public-key.pem 2>/dev/null
          chmod 644 ib/files/etc/apk/keys/public-key.pem
          echo "public key sha256: $(sha256sum ib/files/etc/apk/keys/public-key.pem | cut -c1-16)"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      # This router's MiWRT package feed. Its index is signed with the key
      # whose public half the image carries; a run without the key builds an
      # unsigned feed, which is never published.
      - name: Build the feed packages
        if: steps.feed-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir sdk-feed
          tar --zstd -xf sdk.tar.zst -C sdk-feed --strip-components=1
          key=
          [ "${SIGNED:-0}" = 1 ] && key="$RUNNER_TEMP/private-key.pem"
          scripts/ac2100/build-feed.sh sdk-feed ac2100-feed $key || {
            for l in ac2100-feed/*.log; do echo "::group::end of $l"; tail -n 60 "$l"; echo "::endgroup::"; done
            exit 1
          }
          rm -rf sdk-feed
          echo "$SIGNED" > ac2100-feed/signed

      - name: Check the feed
        run: |
          set -eu
          rm -f sdk.tar.zst
          # the image lists the feed under this architecture and release
          arch=$(cat ac2100-feed/arch)
          [ "$arch" = mipsel_24kc ] || { echo "::error::feed built for $arch, the image lists mipsel_24kc"; exit 1; }
          grep -qx "https://iroham.github.io/MiWRT/feed/ac2100/$OPENWRT/$arch/miwrt/packages.adb" ib/files/etc/apk/repositories.d/miwrt.list ||
            { echo "::error::the image's miwrt.list does not name this feed"; cat ib/files/etc/apk/repositories.d/miwrt.list; exit 1; }
          [ -s ac2100-feed/miwrt/packages.adb ] || { echo "::error::no index"; exit 1; }
          # a feed from the cache must have been signed if this run signs
          [ "${SIGNED:-0}" = 0 ] || [ "$(cat ac2100-feed/signed)" = 1 ] || { echo "::error::the feed packages are unsigned"; exit 1; }
          ls -la ac2100-feed/miwrt
          (cd ac2100-feed/miwrt && sha256sum *.apk packages.adb)

      - name: Build the image
        run: |
          set -eu
          pkgs=$(grep -vE '^\s*(#|$)' scripts/ac2100/packages.list | tr '\n' ' ')
          echo "packages: $pkgs"
          cd ib
          make image PROFILE="$PROFILE" PACKAGES="$pkgs" FILES="$PWD/files" 2>&1 | tee ../make-image.log | grep -vE '^\s*$' | tail -n 60
          test "${PIPESTATUS[0]}" = 0
          # The root filesystem that went into the image has the 5 GHz driver
          # built here, and it is for the same kernel as the modules beside it.
          root=$(ls -d build_dir/target-*/root-* | head -n 1)
          kver=$(ls ../wifi-driver/lib/modules | head -n 1)
          [ -s "$root/lib/modules/$kver/mt76.ko" ] || { echo "::error::the image's kernel is not $kver, the Wi-Fi driver was built for another one"; exit 1; }
          want=$(strings "$root/lib/modules/$kver/mt76.ko" | sed -n 's/^vermagic=//p' | head -n 1)
          for m in mt7615-common.ko mt7615e.ko; do
            cmp "$root/lib/modules/$kver/$m" "../wifi-driver/lib/modules/$kver/$m" || { echo "::error::$m in the image is not the one built here"; exit 1; }
            have=$(strings "$root/lib/modules/$kver/$m" | sed -n 's/^vermagic=//p' | head -n 1)
            [ -n "$want" ] && [ "$have" = "$want" ] || { echo "::error::$m is for '$have', the image's modules are for '$want'"; exit 1; }
          done
          echo "the image carries the Wi-Fi driver built here ($want)"

      - name: Collect the output under the device name
        run: |
          set -eu
          src=ib/bin/targets/$TARGET
          ls -la "$src"
          mkdir -p out
          # the ImageBuilder puts the OpenWrt version into the file names; the
          # updater and the instructions use the plain device name, as the
          # BE7000 release does
          for f in "$src"/openwrt-"$OPENWRT"-*; do
            n=$(basename "$f")
            cp "$f" "out/openwrt-${n#openwrt-$OPENWRT-}"
          done
          cp "$src"/profiles.json out/ 2>/dev/null || true
          cp make-image.log out/
          # provenance: what this image was built from
          {
            echo "openwrt=$OPENWRT"
            echo "imagebuilder_sha256=$IB_HASH"
            echo "profile=$PROFILE"
            echo "repository=${{ github.repository }}"
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref_name }}"
            echo "run=${{ github.run_id }}"
            # the 5 GHz driver: mt76 of this release plus scripts/ac2100/mt76-patches
            sed 's/^\([0-9a-f]*\)  *lib\/modules\/[^/]*\/\(.*\)$/wifi_driver_sha256_\2=\1/' wifi-driver.sha256
          } > out/ac2100-build-metadata.txt
          cat out/ac2100-build-metadata.txt
          # the checksum list names the files a release carries and nothing else
          (cd out && sha256sum "$DEVICE-squashfs-kernel1.bin" "$DEVICE-squashfs-rootfs0.bin" \
             "$DEVICE-squashfs-sysupgrade.bin" "$DEVICE.manifest" > "$SUMS")
          if [ "${SIGNED:-0}" = 1 ]; then
            # the list is signed with the key every image carries, so a router can
            # tell that an update really comes from this build
            openssl dgst -sha256 -sign "$RUNNER_TEMP/private-key.pem" -out "out/$SUMS.sig" "out/$SUMS"
            openssl dgst -sha256 -verify ib/files/etc/apk/keys/public-key.pem -signature "out/$SUMS.sig" "out/$SUMS"
          fi
          ls -la out

      - name: Verify the image
        run: |
          scripts/ac2100/verify-image.sh out
          # the feed travels with the artifact for tests; a release publishes it on Pages
          mkdir -p out/feed && cp ac2100-feed/miwrt/* out/feed/

      - name: What is in the image
        run: |
          set -u
          cd out
          echo "### packages ($(wc -l < "$DEVICE.manifest"))"
          cat "$DEVICE.manifest"
          echo "### sysupgrade CONTROL"
          tar -xOf "$DEVICE-squashfs-sysupgrade.bin" --wildcards 'sysupgrade-*/CONTROL' 2>/dev/null || true
          echo "### sysupgrade metadata"
          tail -c 2048 "$DEVICE-squashfs-sysupgrade.bin" | strings | grep -o '{.*}' | head -c 1500; echo
          echo "### MiWRT files inside the root filesystem"
          tar -xOf "$DEVICE-squashfs-sysupgrade.bin" --wildcards 'sysupgrade-*/root' > root.squashfs 2>/dev/null || true
          us=$(ls ../ib/staging_dir/host/bin/unsquashfs* 2>/dev/null | head -1)
          if [ -s root.squashfs ] && [ -n "$us" ]; then
            "$us" -d '' -ls root.squashfs 2>/dev/null | grep -E 'miwrt|be7000-update|uci-defaults/|openwrt_release|banner$' | sort
          else
            echo "(no unsquashfs in the ImageBuilder, listing skipped)"
          fi
          rm -f root.squashfs
          {
            echo "## Redmi AC2100 image, OpenWrt $OPENWRT"
            echo '```'
            ls -la openwrt-*
            echo
            cat ac2100-build-metadata.txt
            echo
            echo "$(wc -l < "$DEVICE.manifest") packages"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package the release
        if: env.RELEASE_TAG != ''
        run: |
          set -eu
          [ "${SIGNED:-0}" = 1 ] || { echo "::error::a release needs the signing key"; exit 1; }
          ZIP="miwrt-ac2100-v$VER.zip"
          mkdir -p out/zip
          cp out/"$DEVICE"-squashfs-kernel1.bin out/"$DEVICE"-squashfs-rootfs0.bin out/"$DEVICE"-squashfs-sysupgrade.bin \
             "out/$SUMS" "out/$SUMS.sig" out/ac2100-build-metadata.txt \
             docs/instruction/ac2100/*.txt scripts/ac2100/hw-report.sh out/zip/
          sed -i "1s/^MiWRT [0-9][0-9.]*/MiWRT $VER/" out/zip/*.txt
          (cd out/zip && zip -q -X "../$ZIP" ./*)
          rm -r out/zip
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          sha256sum "out/$ZIP"

      # The feed goes up before the release, so an image never names a feed
      # that is not there yet. Directory: feed/ac2100/<OpenWrt release>/<arch>/miwrt,
      # beside the BE7000's feed/<base>/aarch64_cortex-a73 (no overlap).
      - name: Publish the feed on GitHub Pages
        if: env.RELEASE_TAG != '' || (inputs.publish_feed && github.ref == 'refs/heads/main')
        run: |
          set -eu
          [ "${SIGNED:-0}" = 1 ] && [ "$(cat ac2100-feed/signed)" = 1 ] || { echo "::error::the feed is published signed only"; exit 1; }
          arch=$(cat ac2100-feed/arch)
          dir="feed/ac2100/$OPENWRT/$arch/miwrt"
          git clone --filter=blob:none --no-checkout --depth 1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feedpages
          cd feedpages
          git sparse-checkout set --no-cone /feed/ac2100/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q --filter=blob:none --depth 1 origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
            mkdir -p "$dir"
            rsync -a --delete ../ac2100-feed/miwrt/ "$dir/"
            git add -A feed/ac2100
            git diff --cached --quiet && { echo "feed unchanged"; exit 0; }
            git commit -q -m "feed: Redmi AC2100 packages, OpenWrt $OPENWRT (${RELEASE_TAG:-${{ github.ref_name }}})"
            git push -q origin gh-pages && exit 0
            sleep $((i * 10))
          done
          exit 1

      # One release per tag holds the files of both routers. It is made by
      # whichever build gets there first, this one or build.yml, with the same
      # title and text; the other one adds its files.
      - name: Publish in the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd out
          R="${{ github.repository }}"
          assets=("$ZIP" "$DEVICE-squashfs-kernel1.bin" "$DEVICE-squashfs-rootfs0.bin" "$DEVICE-squashfs-sysupgrade.bin" \
                  "$DEVICE.manifest" ac2100-build-metadata.txt "$SUMS" "$SUMS.sig")
          if ! gh release view "$RELEASE_TAG" -R "$R" >/dev/null 2>&1; then
            notes=../docs/release-notes/$RELEASE_TAG.md
            if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
            # --target creates the tag on the built commit when it does not exist yet
            gh release create "$RELEASE_TAG" -R "$R" --target "${{ github.sha }}" --title "MiWRT $VER" "${args[@]}" ||
              gh release view "$RELEASE_TAG" -R "$R" >/dev/null   # the other build made it at the same moment
          fi
          gh release upload "$RELEASE_TAG" -R "$R" --clobber "${assets[@]}"
          # the text ends with the checksum of each archive: add this one's,
          # in place of the line an earlier run of this build left
          ../scripts/release-notes-sum.sh "$ZIP" "$(gh release view "$RELEASE_TAG" -R "$R" --json body --jq .body)" > "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" -R "$R" --notes-file "$RUNNER_TEMP/body.md"

      # miwrt-update tries firmware/<tag>/ on GitHub Pages before github.com.
      # The directory is the one build.yml mirrors the BE7000 image into; the
      # three newest releases are kept.
      - name: Mirror the image on GitHub Pages
        if: env.RELEASE_TAG != ''
        run: |
          set -eu
          git clone --filter=blob:none --no-checkout --depth 1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mirror
          cd mirror
          git sparse-checkout set --no-cone /firmware/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="$RELEASE_TAG"
          for i in 1 2 3 4 5; do
            git fetch -q --filter=blob:none --depth 1 origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
            mkdir -p "firmware/$tag"
            cp "../out/$DEVICE-squashfs-sysupgrade.bin" "../out/$SUMS" "../out/$SUMS.sig" "firmware/$tag/"
            ls -d firmware/v* | sort -V | head -n -3 | xargs -r git rm -rq
            git add -A firmware
            git diff --cached --quiet && exit 0
            git commit -q -m "firmware: $tag image mirror, Redmi AC2100"
            git push -q origin gh-pages && exit 0
            sleep $((i * 10))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: miwrt-ac2100-${{ env.OPENWRT }}-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: error
