# Docker pulls in br_netfilter, which turns these on and sends all bridged LAN
# traffic through the firewall hooks a second time: extra work for every LAN
# packet, and it breaks tools that redirect LAN traffic. Docker does not need
# them for routed traffic, so keep them off.
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-arptables=0
